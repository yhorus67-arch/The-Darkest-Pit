function cmb(){let u=X.cu,k=X.sk,pos=u&&u.c?X.P.indexOf(u)+1:0;
const uc=(x,i,hs)=>{let s=hs?st(x):x,tg=k&&X.pl&&(hs?k.t=='A':!'AS'.includes(k.t)&&k.t.includes(i+1)),mh=hs?s.hp:x.mhp;

let bt=X.pl?`<div class=nr>${u.nm} · posição ${pos}${k?' — escolha o alvo':''}</div><div class=g2>${sk.map((q,i)=>`<button class="btn${k==q?' pri':''}" data-a=sk data-v=${i} ${q.f.includes(pos)&&!off(q,u)?'':'disabled'}>${q.n}${OP.sp?skc(q,u):skd(q,u,pos)}<small style="display:none">${(u.cd&&u.cd[q.n]>0?'⏳'+u.cd[q.n]+' ':q.cd?'↻'+q.cd+' ':'')+(q.lb||'de '+q.f.split('').join('/')+' → '+(q.t=='A'?'aliado':q.t=='S'?'si':q.t.split('').join('/')))}</small></button>`).join('')}</div><div class=g4><button class=btn data-a=mv data-v=-1 ${pos<2?'disabled':''}>⬆</button><button class=btn data-a=mv data-v=1 ${pos>=X.P.length?'disabled':''}>⬇</button><button class=btn data-a=ps>⏭</button><button class=btn data-a=fg ${X.bs?'disabled':''}>🏃</button></div><small>⬆⬇ mover · ⏭ passar · 🏃 fugir</small>`:'<div class=nr>… os sons do combate …</div>';
return tp()+`<small>Rodada ${X.r} · ${X.t>=60?'luz firme':X.t<=25?'ESCURIDÃO':'luz fraca'}</small><div class=cols><div>${X.P.map((h,i)=>uc(h,i,1)).join('')}</div><div>${X.E.map((e,i)=>uc(e,i,0)).join('')}</div></div><div class=nr>${X.lg.slice(OP.sp?-1:-3).join('<br>')}</div>`+bt}
function end(){let s=X.sm;return `<h1>${['Ruína','Retorno','Retirada'][s.m]}</h1><p class=nr>${P(s.m==1?NR.w:NR.l)}</p><p>💰 +${s.g} · 🗿 +${s.r}</p>${s.bi?`<p>Espólio do chefe: ${IT[s.bi].g} ${IT[s.bi].n}</p>`:''}${(s.ns||[]).map(t=>`<p>✦ ${t}.</p>`).join('')}${s.dd.length?`<p class=bad>Perdidos para sempre: ${s.dd.join(', ')}.</p>`:''}<button class="btn pri" data-a=vl>Voltar à vila</button><button class=btn data-a=hp>📖 Grimório</button>`}
function hc(h){let s=st(h),c=CL[h.c],i=G.pt.indexOf(h.id),hcs=Math.max(10,40-8*G.b.h);
return `<div class="card${i>=0?' sel':''}${VC==h.id?' op':''}"><button class=ic style="float:right" data-a=fc data-v=${h.id}>ℹ️</button><button class=ic style="float:right" data-a=ex data-v=${h.id}>${VC==h.id?'▴':'▾'}</button><button class=ic style="float:right" data-a=pt data-v=${h.id}>${i>=0?'➖':'➕'}</button><b>${gl(h)} ${h.nm}</b> <small>${c.n} · nível ${h.lv}${i>=0?' · posição '+(i+1):''}</small><div class=bar><i class=hp style="width:${100*h.hp/s.hp}%"></i></div><div class=bar><i class=sb style="width:${h.s}%"></i></div><small>PV ${h.hp}/${s.hp} · 😨 ${h.s}${h.aff?' · ☗ '+AF[h.aff].n:''}</small><small>${h.q.map(k=>QK[k].n+' ('+qd(QK[k].m)+')').join(' · ')}</small>
<div class=dt>${hpn(h)}<div class=g2><button class=btn data-a=pt data-v=${h.id}>${i>=0?'Tirar do grupo':'Escalar'}</button><button class=btn data-a=heal data-v=${h.id} ${h.hp>=s.hp||G.gold<hcs?'disabled':''}>🏥 Curar ${hcs}💰</button><button class=btn data-a=tav data-v=${h.id} ${!h.s||G.gold<50?'disabled':''}>🍺 Taverna 50💰</button>${h.aff?`<button class=btn data-a=cure data-v=${h.id} ${G.gold<80?'disabled':''}>Tratar aflição 80💰</button>`:''}</div></div></div>`}
function vil(){if(VT==1)return rcv();if(VT==2)return shp();return `<h1>🔔 The Darkest Pit</h1><p class="nr fl2">${NR.v[G.day%2]}</p><div class=top><span>Dia ${G.day}</span><span>💰 ${G.gold}</span><span>🗿 ${G.rl}</span><button class=ic data-a=hp>📖</button><button class=ic data-a=mu>${G.mu?'🔇':'🔊'}</button></div>
${tabs()}${OP.sp?'<button class="btn pri" data-a=prep>⚡ Preparar grupo (cura, taverna e formação)</button>':''}<h2>Formação · arraste as caixas (frente → fundo)</h2><div id=fm class=g4>${[0,1,2,3].map(i=>{let h=G.ro.find(x=>x.id==G.pt[i]);return `<div class=sl><small>pos ${i+1}</small>${h?`<div class=hb data-id=${h.id}>${gl(h)}<small>${h.nm}</small></div>`:'<div class=em>vazio</div>'}</div>`}).join('')}</div>${fm0()}${DN.map((d,i)=>`<button class="btn pri" data-a=go data-v=${i} ${i>=G.un||!G.pt.length?'disabled':''}>${i<G.un?'Partir':'🔒'}: ${d.n}<small>${d.r} salas · perigo ×${d.m}</small></button>`).join('')}
<h2>Heróis (${G.ro.length}/8)</h2>${G.ro.map(hc).join('')}<button class=btn data-a=vt data-v=1>Ir ao recrutamento (100💰)</button>
<h2>Construções</h2>${[['h','🏥 Hospital','cura mais barata'],['t','🍺 Taverna','mais alívio de estresse'],['f','⚒ Forja','+dano e +PV']].map(([k,n,d])=>{let l=G.b[k];return `<button class=btn data-a=up data-v=${k} ${l>=3||G.gold<(l+1)*120||G.rl<(l+1)*2?'disabled':''}>${n} nv ${l}/3<small>${d} · ${l>=3?'máximo':(l+1)*120+'💰 + '+(l+1)*2+'🗿'}</small></button>`}).join('')}
<button class=btn data-a=mn>☰ Menu principal e opções</button>`}
